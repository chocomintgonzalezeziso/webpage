<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ゴールダッシュ</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Side Runner</p>
          <h1>ゴールダッシュ</h1>
        </div>
        <button class="reset-button" type="button" id="resetButton">リセット</button>
      </header>

      <section class="scoreboard" aria-label="ステータス">
        <div>
          <span>距離</span>
          <strong id="distanceText">0m</strong>
        </div>
        <div>
          <span>ライフ</span>
          <strong id="lifeText">6</strong>
        </div>
        <div>
          <span>障害物</span>
          <strong id="obstacleText">0</strong>
        </div>
        <div>
          <span>タイム</span>
          <strong id="timeText">0.0</strong>
        </div>
      </section>

      <section class="game-wrap">
        <canvas id="game" width="960" height="540" aria-label="左から右に走る障害物ゲーム"></canvas>
        <div class="message" id="message">
          <strong>ゴールまで走れ</strong>
          <span>スペース / ↑ / タップで2段ジャンプ。↓ / Sでスライディング。Rでリセット。</span>
        </div>
      </section>

      <section class="controls" aria-label="操作">
        <button type="button" id="jumpButton">ジャンプ</button>
        <button type="button" id="slideButton">スライディング</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
