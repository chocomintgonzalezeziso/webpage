<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自己紹介</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <section class="profile">
        <div class="avatar" aria-hidden="true">自</div>
        <div class="intro">
          <p class="eyebrow">Profile</p>
          <h1>こんにちは、〇〇です。</h1>
          <p class="lead">
            好きなことを少しずつ形にしながら、毎日を楽しく過ごしています。
          </p>
        </div>
      </section>

      <section class="content">
        <div class="block">
          <h2>About</h2>
          <p>
            ここに自分のことを書きます。学校、仕事、得意なこと、最近がんばっていることなどを
            短くまとめると読みやすくなります。
          </p>
        </div>

        <div class="block">
          <h2>好きなこと</h2>
          <ul class="tags">
            <li>バスケ</li>
            <li>音楽</li>
            <li>ゲーム</li>
            <li>ものづくり</li>
          </ul>
        </div>

        <div class="block">
          <h2>ひとこと</h2>
          <p>
            これからいろいろなことに挑戦して、自分らしいページに育てていきたいです。
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
